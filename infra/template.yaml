AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  VayuGuard - Proactive Clean Air Intelligence & Timetable Orchestrator
  AWS Serverless Application Model (SAM) Infrastructure

Parameters:
  WaqiToken:
    Type: String
    NoEcho: true
    Description: WAQI API token (from aqicn.org), passed at deploy time, never stored in the template

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: !Ref VayuGuardTable
        SNS_TOPIC_ARN: !Ref VayuGuardAlertTopic
        BEDROCK_MODEL_ID: amazon.nova-lite-v1:0

Resources:
  # ─── 1. Amazon DynamoDB Telemetry Store ───────────────────────────
  VayuGuardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: VayuGuardTelemetry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─── 2. Amazon SNS Notification Topic ─────────────────────────────
  VayuGuardAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: VayuGuard-CleanAir-Alerts
      DisplayName: VayuGuard School Alerts

  # ─── 3. Lambda: AQI Telemetry Ingestion ───────────────────────────
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: ingest.lambda_handler
      Description: Ingests live WAQI / CPCB air quality sensor readings
      Environment:
        Variables:
          WAQI_TOKEN: !Ref WaqiToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VayuGuardTable
      Events:
        ScheduledIngest:
          Type: Schedule
          Properties:
            Schedule: cron(0/15 2-9 ? * MON-FRI *)
            Description: Runs every 15 minutes during Indian school hours (IST)
            Enabled: true

  # ─── 4. Lambda: 6-Hour Diurnal Forecast ───────────────────────────
  ForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: forecast.lambda_handler
      Description: Generates short-horizon diurnal boundary-layer smog forecast
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VayuGuardTable

  # ─── 5. Lambda: Amazon Bedrock Schedule Optimizer ─────────────────
  BedrockAdvisorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: bedrock_advisor.lambda_handler
      Timeout: 60
      Description: Invokes Amazon Bedrock (Nova Lite by default, model-agnostic via Converse API) for schedule rewiring
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
                - "arn:aws:bedrock:*:*:inference-profile/us.amazon.nova-lite-v1:0"

  # ─── 6. Lambda: Multi-Channel Alert Dispatcher ────────────────────
  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: dispatcher.lambda_handler
      Description: Fans out bilingual WhatsApp/SMS and Web Push notifications
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt VayuGuardAlertTopic.TopicName

  # ─── 7. Lambda: Full FastAPI Backend (public HTTP API) ────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda_handler.handler
      Timeout: 30
      MemorySize: 512
      Description: Public REST API for the VayuGuard dashboard (FastAPI via Mangum)
      Environment:
        Variables:
          WAQI_TOKEN: !Ref WaqiToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VayuGuardTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt VayuGuardAlertTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
                - "arn:aws:bedrock:*:*:inference-profile/us.amazon.nova-lite-v1:0"
      Events:
        RootPath:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyPath:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref VayuGuardTable
  SNSTopicArn:
    Description: SNS Topic ARN for Alerts
    Value: !Ref VayuGuardAlertTopic
  ApiUrl:
    Description: Public HTTPS endpoint for the VayuGuard backend API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
